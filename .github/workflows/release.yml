name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "v2.9.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/talos-mcp-server_*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # NOTE: This job authenticates to npm via OIDC trusted publishing (tokenless).
  # Trusted Publishers are configured on npmjs.com for all 5 packages.
  # Requires npm >= 11.5.1 — Node.js 22 LTS ships with npm 10.x so we upgrade
  # npm explicitly. registry-url is intentionally omitted: setup-node's .npmrc
  # placeholder (_authToken=${NODE_AUTH_TOKEN}) blocks the OIDC auth exchange.
  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Ship the CHANGELOG.md pointer in the npm package
        run: cp CHANGELOG.md npm/talos-mcp/CHANGELOG.md

      - name: Prepare platform packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          declare -A MAPPING=(
            ["linux_amd64"]="linux-x64"
            ["linux_arm64"]="linux-arm64"
            ["darwin_amd64"]="darwin-x64"
            ["darwin_arm64"]="darwin-arm64"
          )

          for go_platform in "${!MAPPING[@]}"; do
            npm_dir="${MAPPING[$go_platform]}"
            archive="dist/talos-mcp-server_${VERSION}_${go_platform}.tar.gz"

            echo "--- Preparing @talos-mcp/${npm_dir} from ${archive}"
            mkdir -p "npm/${npm_dir}/bin"
            tar -xzf "${archive}" -C "npm/${npm_dir}/bin/" talos-mcp
            chmod +x "npm/${npm_dir}/bin/talos-mcp"

            cd "npm/${npm_dir}"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            cd ../..
          done

      - name: Set version in main package
        env:
          PKG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd npm/talos-mcp
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.PKG_VERSION;
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = process.env.PKG_VERSION;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish platform packages
        run: |
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "--- Publishing @talos-mcp/${dir}"
            cd "npm/${dir}"
            npm publish --access public --provenance
            cd ../..
          done

      - name: Publish main package
        run: |
          cd npm/talos-mcp
          npm publish --access public --provenance

  # NOTE: Registry publish runs after npm-publish so the registry can verify
  # the npm package (with mcpName) exists before accepting the server entry.
  # Fail-loud: continue-on-error was previously true to shield primary release
  # artifacts from registry outages, but it also hid validation rejections (e.g.
  # v2.3.0 silently failed with HTTP 422 on a description-too-long error). The
  # surfaced trade-off — a real registry 5xx now fails the release run — is
  # preferred over silent breakage. If registry outages become a recurring noise
  # source, consider differentiating 4xx (our config bug) from 5xx (their fault).
  mcp-registry-publish:
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
