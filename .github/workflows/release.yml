name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare platform packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          declare -A MAPPING=(
            ["linux_amd64"]="linux-x64"
            ["linux_arm64"]="linux-arm64"
            ["darwin_amd64"]="darwin-x64"
            ["darwin_arm64"]="darwin-arm64"
          )

          for go_platform in "${!MAPPING[@]}"; do
            npm_dir="${MAPPING[$go_platform]}"
            archive="dist/talos-mcp_${VERSION}_${go_platform}.tar.gz"

            echo "--- Preparing @talos-mcp/${npm_dir} from ${archive}"
            mkdir -p "npm/${npm_dir}/bin"
            tar -xzf "${archive}" -C "npm/${npm_dir}/bin/" talos-mcp
            chmod +x "npm/${npm_dir}/bin/talos-mcp"

            cd "npm/${npm_dir}"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            cd ../..
          done

      - name: Set version in main package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cd npm/talos-mcp
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${VERSION}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "--- Publishing @talos-mcp/${dir}"
            cd "npm/${dir}"
            npm publish --access public
            cd ../..
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/talos-mcp
          npm publish
