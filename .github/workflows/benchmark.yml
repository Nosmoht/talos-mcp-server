name: Benchmarks

on:
  pull_request:
    paths:
      # Keep in sync with ci.yml changes job and auto-tag.yml.
      - '*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark PR branch
        run: go test -bench=. -benchmem -count=6 -run='^$' -timeout=5m ./... > /tmp/bench-pr.txt

      - name: Benchmark base branch
        run: |
          git checkout "${{ github.event.pull_request.base.sha }}"
          # Base branch may not have benchmarks yet — that is fine.
          go test -bench=. -benchmem -count=6 -run='^$' -timeout=5m ./... > /tmp/bench-base.txt 2>/dev/null || true
          git checkout "${{ github.event.pull_request.head.sha }}"

      - name: Compare benchmarks
        id: compare
        run: |
          if [ ! -s /tmp/bench-base.txt ] || ! grep -q '^Benchmark' /tmp/bench-base.txt; then
            echo "has_comparison=false" >> "$GITHUB_OUTPUT"
            # Still report PR-only results
            cp /tmp/bench-pr.txt /tmp/benchstat.txt
            exit 0
          fi

          benchstat base=/tmp/bench-base.txt pr=/tmp/bench-pr.txt > /tmp/benchstat.txt 2>&1 || true
          echo "has_comparison=true" >> "$GITHUB_OUTPUT"

      - name: Post benchmark comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- benchmark-results -->"
          BENCHSTAT=$(cat /tmp/benchstat.txt)
          HAS_COMPARISON="${{ steps.compare.outputs.has_comparison }}"

          # Count improvements / regressions / unchanged from benchstat output.
          # benchstat v2 shows "-X.XX%" for faster, "+X.XX%" for slower, "~" for unchanged.
          IMPROVED=$(grep -cE ' -[0-9]+\.[0-9]+%' /tmp/benchstat.txt || true)
          REGRESSED=$(grep -cE ' \+[0-9]+\.[0-9]+%' /tmp/benchstat.txt || true)
          NEUTRAL=$(grep -c ' ~ ' /tmp/benchstat.txt || true)

          # Build summary line
          SUMMARY=""
          if [ "$HAS_COMPARISON" = "true" ]; then
            [ "$IMPROVED" -gt 0 ] && SUMMARY="🟢 **${IMPROVED} improved**"
            [ "$REGRESSED" -gt 0 ] && SUMMARY="${SUMMARY:+$SUMMARY · }🔴 **${REGRESSED} regressed**"
            [ "$NEUTRAL" -gt 0 ] && SUMMARY="${SUMMARY:+$SUMMARY · }⚪ ${NEUTRAL} unchanged"
          else
            SUMMARY="📊 First benchmark run — no base branch comparison available"
          fi

          # Annotate benchstat output: prepend emoji to each benchmark result line
          ANNOTATED=$(awk '
            / -[0-9]+\.[0-9]+% \(/ { printf "🟢 %s\n", $0; next }
            / \+[0-9]+\.[0-9]+% \(/ { printf "🔴 %s\n", $0; next }
            / ~ \(/ { printf "⚪ %s\n", $0; next }
            { print }
          ' /tmp/benchstat.txt)

          # Compose the comment body
          BODY=$(cat <<EOF
          ## ⚡ Benchmark Results

          ${SUMMARY}

          \`\`\`
          ${ANNOTATED}
          \`\`\`

          <sub>Compared against \`${{ github.event.pull_request.base.ref }}\` at \`${{ github.event.pull_request.base.sha }}\` · generated by CI</sub>

          ${MARKER}
          EOF
          )

          # Remove leading whitespace from heredoc
          BODY=$(echo "$BODY" | sed 's/^          //')

          # Find existing benchmark comment and update, or create new one
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
