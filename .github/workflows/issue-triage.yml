name: issue-triage

on:
  issues:
    types: [opened]

# Required GitHub App permissions (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY):
#   issues: write — to apply priority and triage labels
permissions:
  contents: read

jobs:
  triage-audit:
    runs-on: ubuntu-latest
    # Only process issues that carry the 'audit' label
    if: >-
      contains(
        toJSON(github.event.issue.labels.*.name),
        'audit'
      )
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const body = context.payload.issue.body || '';
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Parse severity from the Code Audit Finding template field:
            //   ### Severity
            //   P0 — critical
            const match = body.match(/###\s*Severity\s*\n\s*(P[0-3])/);

            let labelToAdd;
            if (match) {
              const severity = match[1]; // P0, P1, P2, or P3
              const severityToLabel = {
                P0: 'priority: P0',
                P1: 'priority: P1',
                P2: 'priority: P2',
                P3: 'priority: P3',
              };
              labelToAdd = severityToLabel[severity];
            }

            if (!labelToAdd) {
              core.info('No severity match found. Applying needs: triage.');
              labelToAdd = 'needs: triage';
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [labelToAdd],
            });

            core.info(`Applied label: ${labelToAdd}`);
