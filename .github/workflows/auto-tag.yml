name: auto-tag

on:
  push:
    branches: [main]
    # Only tag when server code changes. npm/ is excluded intentionally: npm wrapper
    # changes cannot alter the compiled binary and should not trigger a release without
    # Go CI validation. NOTE: keep this path list in sync with ci.yml 'changes' job.
    paths:
      - '*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.goreleaser.yaml'

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          default_bump: false
          tag_prefix: "v"
          fetch_all_tags: true
