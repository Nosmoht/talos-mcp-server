min_version = "2026.11.5"

[settings]
idiomatic_version_file_enable_tools = ["go"]
locked = true
lockfile_platforms = ["linux-x64", "linux-x64-musl", "linux-arm64", "linux-arm64-musl", "macos-x64", "macos-arm64"]

[env]
GOTOOLCHAIN = "local"
GOENV = "off"
GOFLAGS = ""
CGO_ENABLED = "1"
GOWORK = "off"
GOOS = ""
GOARCH = ""

[tools]
"aqua:golangci/golangci-lint" = "2.15.0"
"github:fe3dback/go-arch-lint" = "1.19.1"
