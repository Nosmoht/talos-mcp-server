name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1" # weekly Monday 03:30 UTC: govulncheck sees new advisories without a PR

permissions:
  contents: read

jobs:
  # Detect which files changed — pull_request only.
  # On push to main and on schedule, always run full CI (paths-filter uses git diff HEAD~1
  # on push, which is inaccurate for rebase merges; full CI on main is the safer default).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # required by dorny/paths-filter to read PR file list
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            go:
              - '*.go'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.goreleaser.yaml'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    # Push to main / schedule: always run. Pull request: only when Go-relevant files changed.
    # The status functions replace the implicit success(), which skips this job whenever
    # 'changes' is skipped, i.e. on every non-PR run. Same for verify, test and build.
    # NOTE: keep Go path list in sync with the 'changes' job and auto-tag.yml.
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11

  verify:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  test:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
      - run: go test -v -race -coverprofile=coverage.out -coverpkg=./... ./...
      - run: go tool cover -func=coverage.out
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
      - run: go build -o talos-mcp ./cmd/talos-mcp

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Validate .claude/settings.json
        run: jq empty .claude/settings.json
      - name: Test reviewer write guard
        run: bash .claude/hooks/review-write-guard.test.sh

  # Single required status check: passes when all CI jobs pass or are legitimately skipped.
  # Skipped = no Go-relevant files changed on this PR.
  merge-guard:
    if: always() && !cancelled()
    needs: [changes, lint, test, build, verify, validate-config]
    runs-on: ubuntu-latest
    steps:
      - name: Fail on CI failure or cancellation
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "CI failed: one or more jobs failed or were cancelled"
          exit 1
      - name: Report CI status
        run: |
          echo "All CI jobs passed or were skipped (no Go-relevant files changed)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
