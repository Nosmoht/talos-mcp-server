name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c # v7
        with:
          version: "v2.9.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/talos-mcp-server_*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # NOTE: This job authenticates to npm via OIDC trusted publishing (tokenless).
  # Trusted Publishers are configured on npmjs.com for all 5 packages.
  # Requires npm >= 11.5.1 — Node.js 22 LTS ships with npm 10.x so we upgrade
  # npm explicitly. registry-url is intentionally omitted: setup-node's .npmrc
  # placeholder (_authToken=${NODE_AUTH_TOKEN}) blocks the OIDC auth exchange.
  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          # Full history + all tags — generate-changelog.sh walks every v* tag.
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Regenerate CHANGELOG.md from tag history
        run: |
          bash .github/scripts/generate-changelog.sh > CHANGELOG.md
          cp CHANGELOG.md npm/talos-mcp/CHANGELOG.md

      - name: Prepare platform packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          declare -A MAPPING=(
            ["linux_amd64"]="linux-x64"
            ["linux_arm64"]="linux-arm64"
            ["darwin_amd64"]="darwin-x64"
            ["darwin_arm64"]="darwin-arm64"
          )

          for go_platform in "${!MAPPING[@]}"; do
            npm_dir="${MAPPING[$go_platform]}"
            archive="dist/talos-mcp-server_${VERSION}_${go_platform}.tar.gz"

            echo "--- Preparing @talos-mcp/${npm_dir} from ${archive}"
            mkdir -p "npm/${npm_dir}/bin"
            tar -xzf "${archive}" -C "npm/${npm_dir}/bin/" talos-mcp
            chmod +x "npm/${npm_dir}/bin/talos-mcp"

            cd "npm/${npm_dir}"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            cd ../..
          done

      - name: Set version in main package
        env:
          PKG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd npm/talos-mcp
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.PKG_VERSION;
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = process.env.PKG_VERSION;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish platform packages
        run: |
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "--- Publishing @talos-mcp/${dir}"
            cd "npm/${dir}"
            npm publish --access public --provenance
            cd ../..
          done

      - name: Publish main package
        run: |
          cd npm/talos-mcp
          npm publish --access public --provenance

  # NOTE: Registry publish runs after npm-publish so the registry can verify
  # the npm package (with mcpName) exists before accepting the server entry.
  # Fail-loud: continue-on-error was previously true to shield primary release
  # artifacts from registry outages, but it also hid validation rejections (e.g.
  # v2.3.0 silently failed with HTTP 422 on a description-too-long error). The
  # surfaced trade-off — a real registry 5xx now fails the release run — is
  # preferred over silent breakage. If registry outages become a recurring noise
  # source, consider differentiating 4xx (our config bug) from 5xx (their fault).
  mcp-registry-publish:
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # NOTE: After the release is published, regenerate the root CHANGELOG.md from
  # the fresh tag history and open a PR that restores parity between the repo's
  # main and the just-published npm tarball. Commits go through the Contents
  # API, which produces web-flow-signed commits — required because branch
  # protection on main sets required_signatures: true. A plain `git push` with
  # GITHUB_TOKEN would be rejected as unsigned. The `gh pr create` call uses the
  # RELEASE_APP installation token rather than the default GITHUB_TOKEN because
  # repo policy sets can_approve_pull_request_reviews: false, which also blocks
  # PR creation by the default token. The RELEASE_APP token already drives
  # auto-tag.yml and bypasses that restriction; it must carry pull_requests:write
  # and contents:write on this repo.
  changelog-pr:
    needs: mcp-registry-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Regenerate CHANGELOG.md
        run: bash .github/scripts/generate-changelog.sh > CHANGELOG.md

      - name: Open PR with updated CHANGELOG
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet CHANGELOG.md; then
            echo "::notice::CHANGELOG.md unchanged against main — no PR needed"
            exit 0
          fi

          BRANCH="chore/changelog-${VERSION}"
          MAIN_OID=$(gh api "/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" --jq .object.sha)

          # Create branch, or reset it to main's tip if a prior failed run left it behind.
          if ! gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
               -f ref="refs/heads/${BRANCH}" -f sha="${MAIN_OID}" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -F sha="${MAIN_OID}" -F force=true >/dev/null
          fi

          # PUT via Contents API → web-flow-signed commit (satisfies required_signatures).
          CONTENT_B64=$(base64 -w0 CHANGELOG.md)
          EXISTING_SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${BRANCH}" --jq .sha 2>/dev/null || echo "")

          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" \
              -f message="chore(changelog): update for ${VERSION}" \
              -f content="${CONTENT_B64}" \
              -f branch="${BRANCH}" \
              -f sha="${EXISTING_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" \
              -f message="chore(changelog): update for ${VERSION}" \
              -f content="${CONTENT_B64}" \
              -f branch="${BRANCH}" >/dev/null
          fi

          if ! gh pr view "${BRANCH}" --repo "${GITHUB_REPOSITORY}" --json number >/dev/null 2>&1; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${BRANCH}" \
              --title "chore(changelog): update for ${VERSION}" \
              --body "Auto-generated CHANGELOG.md refresh for release ${VERSION}. Regenerated from tag history by \`.github/scripts/generate-changelog.sh\`."
          fi
